<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phos · 训练数据工作台</title>
<style>
:root{color-scheme:light;--ink:#202622;--muted:#727970;--line:#dbe0d8;--green:#315c47;--paper:#f4f5f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);background:#fff}h1{font-size:22px;letter-spacing:-.5px;margin:0 0 5px}header p{margin:0;color:var(--muted);font-size:12px}.tag{border:1px solid #cbd6ca;border-radius:24px;padding:7px 12px;color:var(--green);font-size:12px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 88px)}aside{max-height:calc(100vh - 88px);position:sticky;top:0;overflow:auto;padding:24px 16px;border-right:1px solid var(--line);background:#fafbf7}label{display:block;color:var(--muted);font-size:12px;margin:0 0 8px}select{width:100%;margin-bottom:18px;padding:9px;border:1px solid var(--line);background:white;border-radius:8px}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:white;color:var(--ink)}button:hover{border-color:#718a76}button:disabled{opacity:.5;cursor:wait}.row{width:100%;text-align:left;display:block;background:transparent;border:1px solid transparent;margin-bottom:7px;padding:12px}.row.active{background:#e6ece2;border-color:#cbd7c6}.row b{display:block;font-size:12px;margin-bottom:5px}.row small{color:var(--muted);font-size:11px}main{padding:26px 30px;max-width:1600px;width:100%;margin:auto}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--green);margin-bottom:10px}h2{font-size:24px;line-height:1.45;font-weight:600;margin:0 0 12px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:22px}.previews{display:grid;grid-template-columns:1fr 1fr;gap:16px}.frame{background:#e3e6dd;border:1px solid var(--line);border-radius:12px;overflow:hidden}.frame span{display:block;padding:12px 15px;background:#fff;font-size:12px}.frame img{display:block;width:100%;height:320px;object-fit:contain;padding:12px}.notice{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{padding:18px;border:1px solid var(--line);border-radius:12px;background:white}.panel h3{font-size:14px;margin:0 0 12px}textarea{width:100%;min-height:85px;font:13px -apple-system,sans-serif;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;background:#fcfcf9;color:var(--ink)}#target{height:230px;font:11px ui-monospace,monospace}pre{font:11px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;background:#f5f6f1;padding:12px;border-radius:8px}details{margin:10px 0}summary{cursor:pointer;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--green);border-color:var(--green);color:white}.status{min-height:22px;margin-top:12px;color:var(--green);font-size:12px}.masks img{height:100px;background:#ddd;margin-right:8px;border-radius:5px}a{color:var(--green)}.metric{font-size:12px;padding:10px;background:#f0f3eb;border-radius:8px;line-height:1.6}@media(max-width:1000px){.layout{grid-template-columns:210px minmax(0,1fr)}main{padding:20px}.bottom{grid-template-columns:1fr}.frame img{height:250px}}@media(max-width:700px){header{padding:18px}.layout{display:block}aside{border-right:0;max-height:220px;overflow:auto}.previews{grid-template-columns:1fr}.frame img{height:260px}}
</style>
<header><div><h1>Phos <span style="font-weight:400;color:#82917e">/</span> 训练数据工作台</h1><p>先验证操作，再判断风格。每一次审核都有记录。</p></div><span class="tag">本机运行 · 不上传照片</span></header>
<div class="layout"><aside><label for="filter">审核状态</label><select id="filter"><option value="all">全部样本</option><option value="pending">待审核</option><option value="approved">已认可</option><option value="needs-correction">需要修正</option><option value="rejected">已拒绝</option></select><label for="splitFilter">数据划分</label><select id="splitFilter"><option value="all">全部划分</option><option value="train">训练集</option><option value="validation">验证集</option><option value="test">测试集</option></select><p id="recordCount" class="notice"></p><div id="list"></div></aside><main><div class="eyebrow">DATASET PREPARATION / PHASE 01—03</div><h2 id="instruction">正在读取本机样本…</h2><div class="meta" id="meta"></div><div class="previews"><div class="frame"><span>调整前 · 模型输入</span><img id="before" alt="调整前"></div><div class="frame"><span>预览 <select id="previewMode" aria-label="预览内容" style="width:auto;margin:0;padding:2px 6px;font:inherit"><option value="target">目标效果 · 待人工认可</option><option value="candidate">模型首次方案 · 经 Phos 规范化</option></select></span><img id="after" alt="目标效果"></div></div><p class="notice" id="datasetNotice">当前是少量公开照片的受控操作样本，全部保留作测试。认可目标效果不会将测试样本加入训练集；成片和蒙版均由 Phos 实际渲染。</p><div class="bottom"><section class="panel"><h3>检查与审核</h3><div id="checks" class="metric"></div><div id="masks" class="masks"></div><p id="source" class="notice"></p><label for="notes">审核备注</label><textarea id="notes" placeholder="例如：背景压暗正确，但幅度太大；保留原构图更合适。"></textarea><div class="actions"><button class="primary" data-decision="approved">认可目标效果</button><button data-decision="needs-correction">需要修正</button><button data-decision="rejected">拒绝收录</button></div><div class="status" id="message" role="status"></div><details><summary>查看模型首次输出与测试检查</summary><pre id="baseline"></pre></details></section><section class="panel"><h3>编辑方案</h3><label for="target">修改后重新渲染，旧审核自动失效</label><textarea id="target" spellcheck="false" aria-label="编辑方案 JSON"></textarea><div class="actions"><button id="replay">保存方案并重新渲染</button></div><details><summary>查看实际参数差异</summary><pre id="diff"></pre></details><p class="notice">几何和明暗方向检查不能替代审美判断。只有审核通过、属于训练集且用途许可匹配的样本才允许导出。</p></section></div></main></div>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id), labels={pending:'待审核',approved:'已认可',rejected:'已拒绝','needs-correction':'需要修正'};let data=[],current=null,busy=false;
function file(path){return '/files/'+path.split('/').map(encodeURIComponent).join('/')}
function text(id,value){$(id).textContent=value}
async function load(id){data=await (await fetch('/api/records')).json();renderList();show(data.find(x=>x.id===id)||data[0]);filterChanged();}
function renderList(){const filter=$('filter').value;text('recordCount','共 '+data.length+' 条；认可仅用于正式数据审核。');$('list').replaceChildren();data.filter(r=>(filter==='all'||r.review.decision===filter)&&($('splitFilter').value==='all'||r.split===$('splitFilter').value)).forEach(r=>{const b=document.createElement('button');b.className='row'+(current?.id===r.id?' active':'');const title=document.createElement('b');title.textContent=r.id;const small=document.createElement('small');small.textContent=(r.task==='crop'?'裁切':'调色与蒙版')+' · '+labels[r.review.decision]+(r.baseline?' / AI '+(r.baseline.firstOutputPass?'通过':'未通过'):'');b.append(title,small);b.onclick=()=>show(r);$('list').append(b);});}
function show(r){if(!r)return;current=r;document.querySelectorAll('[data-decision]').forEach(b=>b.disabled=false);$('previewMode').value='target';$('previewMode').options[1].disabled=r.baseline?.status!=='evaluated';renderList();text('instruction',r.instruction);text('meta',r.sourceId+' · '+({train:'训练集',validation:'验证集',test:'测试集'}[r.split]||r.split)+' / '+r.groupId+' · '+labels[r.review.decision]);$('before').src=file(r.renderPath+'/before.jpg');$('after').src=file(r.renderPath+'/after.jpg');$('notes').value=r.review.notes||'';$('target').value=JSON.stringify(r.plan||r.crop,null,2);text('checks','目标方案：'+(r.render.changed?'参数有变化':'参数保持不变')+'；'+(r.render.directionChecked?(r.render.directionError?'局部方向检查失败：'+r.render.directionError:'局部方向检查通过'):'未涉及局部明暗方向')+'。');text('datasetNotice',r.labelType==='deterministic-operation'?'这是已通过程序检查的受控操作样本，正在用于隔离试训，不代表专业审美。正式发布训练导出仍需有效人工审核及许可匹配。':'这是公开照片的流程测试样本，认可目标效果也不会将测试集加入训练。');text('source','标签来源：'+r.provenance);text('baseline',r.baseline?JSON.stringify({firstOutputPass:r.baseline.firstOutputPass,checks:r.baseline.checks,raw:r.baseline.rawJSON,error:r.baseline.error},null,2):'基线尚未完成。');$('masks').replaceChildren();r.render.masks.forEach(name=>{const img=document.createElement('img');img.src=file(r.renderPath+'/'+name);img.alt=name;$('masks').append(img)});text('diff',JSON.stringify(r.parameterDiff,null,2));text('message','');}
async function post(path,body){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);text('message','正在保存并验证…');try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');const id=current.id;await load(id);text('message',path==='/api/plan'?'新预览已生成，请重新审核。':'审核已保存；测试集仍不会用于训练。')}catch(e){text('message',e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>post('/api/review',{id:current.id,decision:b.dataset.decision,notes:$('notes').value}));$('replay').onclick=()=>{try{post('/api/plan',{id:current.id,target:JSON.parse($('target').value)})}catch(e){text('message','JSON 格式错误：'+e.message)}};$('previewMode').onchange=()=>{const candidate=$('previewMode').value==='candidate';$('after').src=file(candidate?'baseline/results/'+current.id+'/rendered/after.jpg':current.renderPath+'/after.jpg');document.querySelectorAll('[data-decision]').forEach(b=>b.disabled=candidate);text('message',candidate?'当前显示模型方案；切回目标效果后再审核标签。':'')};function filterChanged(){renderList();const matching=data.filter(r=>($('filter').value==='all'||r.review.decision===$('filter').value)&&($('splitFilter').value==='all'||r.split===$('splitFilter').value));if(matching.length&&!matching.some(r=>r.id===current?.id))show(matching[0]);if(!matching.length)text('message','当前筛选没有样本；右侧保留上次查看的样本。');}$('filter').onchange=filterChanged;$('splitFilter').onchange=filterChanged;load().catch(e=>text('instruction','读取失败：'+e.message));
</script></html>
