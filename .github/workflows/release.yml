name: Build & Release RawForge

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          swift --version

      - name: Build + package .app
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          ls -R RawForge.app/Contents | head -30

      - name: Zip + checksum
        run: |
          zip -qyr RawForge-macOS-apple-silicon.zip RawForge.app
          shasum -a 256 RawForge-macOS-apple-silicon.zip > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RawForge-macOS-apple-silicon
          path: |
            RawForge-macOS-apple-silicon.zip
            SHA256.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RawForge-macOS-apple-silicon.zip
            SHA256.txt
